name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Scan public content
        run: npm run check:public
      - name: Check module portability
        run: npm run check:portable
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Check package contents
        run: npm pack --dry-run
